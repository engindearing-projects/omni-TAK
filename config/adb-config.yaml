  enable_swagger: true
  enable_static_files: true

auth:
  admin_user: "admin"
  admin_password: "admin123"

logging:
  level: "info"
  format: "text"

metrics:
  enabled: true

performance:
  buffer_size: 8192
  max_message_size: 1048576
  connection_timeout: 30
  keepalive_interval: 60

security:
  audit_logging: true
  cors_origins:
    - "http://localhost:3000"
