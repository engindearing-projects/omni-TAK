application:
  max_connections: 100
  worker_threads: 4

servers:
  - id: tak-server-from-device
    name: "TAK Server from Phone"
    address: "67.5.126.161:8089"
    protocol: tls
    auto_reconnect: true
    reconnect_delay_ms: 5000
    tls:
      cert_path: "certs/from-device/client.pem"
      key_path: "certs/from-device/client.key"
      ca_path: "certs/from-device/ca.pem"
