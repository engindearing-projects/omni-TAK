# OmniTAK Bidirectional Aggregator Configuration
# Connects to TAK Server 5.5 at ots.engindearing.soy

# REST API Configuration (optional)
api:
  bind_addr: "127.0.0.1:9443"
  enable_tls: false

# TAK Server Connections
servers:
  # Official TAK Server 5.5 at ots.engindearing.soy
  - id: tak-server-55
    address: "ots.engindearing.soy:8089"
    protocol: "tls"
    tls:
      cert_path: "/Users/iesouskurios/omniTAK/certs/admin.p12"
      key_path: "/Users/iesouskurios/omniTAK/certs/admin.p12"
      ca_path: "/Users/iesouskurios/omniTAK/certs/ca.pem"

